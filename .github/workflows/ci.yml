name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: ASTRO_TELEMETRY_DISABLED=1 npx astro build --root examples/astro
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm ci
        working-directory: sandbox-tests
      - run: npm test
        working-directory: sandbox-tests
      - run: npm run pack:candidate
      - run: npx emdash-plugin bundle --dir packages/sandboxed --out-dir artifacts
      - run: node scripts/release-kit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: quixforms-0.1.0-manual-test
          path: artifacts/quixforms-0.1.0-manual-test.tar.gz
